# Render Blueprint — PostPulse
#
# Provisions the FastAPI backend connected to your Supabase PostgreSQL database.
# The React frontend is deployed separately on Vercel (see frontend/README_DEPLOY.md).
#
# Usage:
#   1. Push this repo to GitHub.
#   2. In Render: New -> Blueprint, connect the repo. It will create the
#      web service defined below.
#   3. Fill in the env vars marked "REQUIRED" below (including DATABASE_URL
#      with your Supabase connection string).
#   4. Set ALLOWED_ORIGINS to your deployed Vercel frontend URL.
#
# See DEPLOYMENT.md for the full walkthrough.

services:
  - type: web
    name: postpulse-api
    runtime: python
    plan: free
    # Build/start from the self-contained backend directory. It includes the
    # model bundle (backend/models/*.joblib) and inference code (backend/app/ml).
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        sync: false
        # REQUIRED - generate with: python -c "import secrets; print(secrets.token_hex(32))"
      - key: DATABASE_URL
        sync: false
        # REQUIRED - Supabase connection string:
        # postgresql+psycopg2://postgres.zfbjixorlzsbnnsruxpb:_5bQkbNC%3F$9v%2FTC@aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require
      - key: ALLOWED_ORIGINS
        sync: false
        # REQUIRED - your Vercel app URL, e.g. https://your-app.vercel.app
      - key: FRONTEND_URL
        sync: false
        # Your Vercel app URL with /, e.g. https://your-app.vercel.app
      - key: AUTO_VERIFY_USERS
        value: "false"
      - key: BREVO_API_KEY
        sync: false
        # Recommended for Render free tier: free Brevo API key (https://brevo.com - 300 emails/day over HTTPS)
      - key: RESEND_API_KEY
        sync: false
        # Alternative: Resend API key (https://resend.com)
      - key: EMAIL_USER
        value: ""
        # Your sender address (verified in Brevo) - used as the Brevo "from"
      - key: EMAIL_FROM_NAME
        value: "PostPulse"
