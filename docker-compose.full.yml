# Full-stack deployment: backend + frontend, all in one command.
#
#   docker compose -f docker-compose.full.yml up -d --build
#
# Before running: copy backend/.env.example to backend/.env and set real
# values for DATABASE_URL (Supabase/PostgreSQL - also used for local dev),
# SECRET_KEY and ADMIN_BOOTSTRAP_EMAIL. This file reads that same .env for
# the backend service. The trained model bundle
# (backend/models/content_performance_bundle.joblib) must already exist -
# run `python ml/src/generate_dataset.py && python ml/src/train.py` first.
services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      ALLOWED_ORIGINS: http://localhost:8080
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"